spec:
  inputs:
    application-version:
      description: "Existing stable package version to deploy without rebuilding, for example v1.2.3"
      default: ""
      regex: "^$|^v[0-9]+\\.[0-9]+\\.[0-9]+$"
---

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - validate
  - test
  - build
  - release
  - plan
  - deploy

default:
  interruptible: true

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  SELECTED_APPLICATION_VERSION: '$[[ inputs.application-version ]]'

include:
  - local: .gitlab/ci/verify.yml
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/deploy.yml
