services:
  frontend:
    build:
      context: .
      dockerfile: src/ChangeMe.Frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    environment:
      CHANGE_ME_API_URL: /api/v1
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: src/ChangeMe.Backend/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - postgres
      - mailhog
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      AuthOptions__Jwt__SigningKey: "${AuthOptions__Jwt__SigningKey:?AuthOptions__Jwt__SigningKey is required}"
      InitialAdministratorOptions__Email: "${InitialAdministratorOptions__Email:?InitialAdministratorOptions__Email is required}"
      InitialAdministratorOptions__Password: "${InitialAdministratorOptions__Password:?InitialAdministratorOptions__Password is required}"
      InitialAdministratorOptions__FirstName: "${InitialAdministratorOptions__FirstName:?InitialAdministratorOptions__FirstName is required}"
      InitialAdministratorOptions__LastName: "${InitialAdministratorOptions__LastName:?InitialAdministratorOptions__LastName is required}"
      EmailOptions__Host: mailhog
      EmailOptions__Username: "${EmailOptions__Username:-}"
      EmailOptions__Password: "${EmailOptions__Password:-}"
      FileStorageOptions__RootPath: /app/storage
    volumes:
      - file-storage-data:/app/storage
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - app-network
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network
    restart: unless-stopped

  # Run: docker compose --profile test run --rm backend-tests
  backend-tests:
    profiles:
      - test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /repo/src/ChangeMe.Backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    command: dotnet test ChangeMe.Backend.slnx -c Release

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  file-storage-data:
