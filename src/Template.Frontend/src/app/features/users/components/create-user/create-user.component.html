<p-card
  class="mb-4"
  header="Create user"
  subheader="Create a user account with email, password, and roles."
>
  <div class="mb-4 flex flex-wrap items-center gap-2">
    <app-back-button label="Back to users list" [route]="['/users']" />
  </div>

  <form class="p-fluid flex flex-col gap-4" [formRoot]="userForm">
    <p-panel header="Profile" [toggleable]="true">
      <div class="grid gap-4 sm:grid-cols-2">
        <app-form-field [field]="userForm.firstName">
          <label for="firstName">First name</label>
          <input
            id="firstName"
            type="text"
            pInputText
            [formField]="userForm.firstName"
          />
        </app-form-field>

        <app-form-field [field]="userForm.lastName">
          <label for="lastName">Last name</label>
          <input id="lastName" type="text" pInputText [formField]="userForm.lastName" />
        </app-form-field>
      </div>

      <app-form-field class="mt-4" [field]="userForm.email">
        <label for="email">Email</label>
        <input id="email" type="email" pInputText [formField]="userForm.email" />
      </app-form-field>
    </p-panel>

    <p-panel header="Password" [toggleable]="true">
      <div class="grid gap-4 sm:grid-cols-2">
        <app-form-field [field]="userForm.password">
          <label for="password">Password</label>
          <p-iconfield iconPosition="right">
            <input
              id="password"
              pInputText
              pInputPassword
              [(mask)]="passwordMasked"
              autocomplete="new-password"
              [formField]="userForm.password"
              [fluid]="true"
            />
            <p-inputicon>
              <button
                type="button"
                class="text-muted-color hover:text-color border-0 bg-transparent p-0"
                [attr.aria-label]="passwordMasked ? 'Show password' : 'Hide password'"
                (click)="passwordMasked = !passwordMasked"
              >
                <i
                  [class]="passwordMasked ? 'pi pi-eye' : 'pi pi-eye-slash'"
                  aria-hidden="true"
                ></i>
              </button>
            </p-inputicon>
          </p-iconfield>
        </app-form-field>

        <app-form-field [field]="userForm.confirmPassword">
          <label for="confirmPassword">Confirm password</label>
          <p-iconfield iconPosition="right">
            <input
              id="confirmPassword"
              pInputText
              pInputPassword
              [(mask)]="confirmPasswordMasked"
              autocomplete="new-password"
              [formField]="userForm.confirmPassword"
              [fluid]="true"
            />
            <p-inputicon>
              <button
                type="button"
                class="text-muted-color hover:text-color border-0 bg-transparent p-0"
                [attr.aria-label]="
                  confirmPasswordMasked ? 'Show password' : 'Hide password'
                "
                (click)="confirmPasswordMasked = !confirmPasswordMasked"
              >
                <i
                  [class]="confirmPasswordMasked ? 'pi pi-eye' : 'pi pi-eye-slash'"
                  aria-hidden="true"
                ></i>
              </button>
            </p-inputicon>
          </p-iconfield>
        </app-form-field>
      </div>
    </p-panel>

    <p-panel header="Roles" [toggleable]="true">
      <app-form-field #roleIdsField [field]="userForm.roleIds">
        <label for="roles">Roles</label>
        <p-select
          inputId="roles"
          [multiple]="true"
          [ngModel]="userModel().roleIds"
          (ngModelChange)="setRoleIds($event)"
          [ngModelOptions]="{ standalone: true }"
          [options]="roleOptions()"
          optionLabel="name"
          optionValue="id"
          placeholder="Select roles"
          [loading]="isLoadingRoles()"
          [invalid]="roleIdsField.showErrors()"
        />
      </app-form-field>
    </p-panel>

    <app-effective-permissions
      [permissions]="effectivePermissions()"
      [roleIdsSelected]="roleIdsSelected()"
    />

    @if (submitError()) {
      <p-message severity="error">{{ submitError() }}</p-message>
    }

    <div class="flex flex-wrap items-center justify-end gap-2">
      <a pButton severity="secondary" [outlined]="true" [routerLink]="['/users']">
        Cancel
      </a>
      <button type="submit" pButton [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
        } @else {
          <i class="pi pi-user-plus" aria-hidden="true"></i>
        }
        {{ isSubmitting() ? 'Creating user...' : 'Create user' }}
      </button>
    </div>
  </form>
</p-card>
