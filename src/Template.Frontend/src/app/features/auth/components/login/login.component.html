<app-auth-page
  title="Welcome back"
  subtitle="Sign in to create, edit and delete issues."
>
  <form class="p-fluid flex flex-col gap-4" [formRoot]="loginForm">
    <app-form-field [field]="loginForm.email">
      <label class="text-color text-sm font-medium" for="email">Email</label>
      <input
        id="email"
        type="email"
        pInputText
        autocomplete="username"
        [formField]="loginForm.email"
      />
    </app-form-field>

    <app-form-field [field]="loginForm.password">
      <label class="text-color text-sm font-medium" for="password">Password</label>
      <p-iconfield iconPosition="right">
        <input
          id="password"
          pInputText
          pInputPassword
          [(mask)]="passwordMasked"
          autocomplete="current-password"
          [formField]="loginForm.password"
          [fluid]="true"
        />
        <p-inputicon>
          <button
            type="button"
            class="text-muted-color hover:text-color border-0 bg-transparent p-0"
            [attr.aria-label]="passwordMasked ? 'Show password' : 'Hide password'"
            (click)="passwordMasked = !passwordMasked"
          >
            <i
              [class]="passwordMasked ? 'pi pi-eye' : 'pi pi-eye-slash'"
              aria-hidden="true"
            ></i>
          </button>
        </p-inputicon>
      </p-iconfield>
    </app-form-field>

    @if (errorMessage()) {
      <p-message severity="error">{{ errorMessage() }}</p-message>
    }

    <button type="submit" pButton [fluid]="true" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
      } @else {
        <i class="pi pi-sign-in" aria-hidden="true"></i>
      }
      {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</app-auth-page>
