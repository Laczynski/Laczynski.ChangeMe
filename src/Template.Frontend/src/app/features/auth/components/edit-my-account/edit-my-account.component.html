<p-card class="mb-4" header="Edit profile" subheader="Update your name.">
  <div class="mb-4 flex flex-wrap items-center gap-2">
    <app-back-button label="Back to my account" [route]="['/account']" />
  </div>

  @if (isLoading()) {
    <div class="flex flex-col items-center gap-2 py-8">
      <p-progress-spinner ariaLabel="Loading profile" />
      <p class="text-muted-color m-0 text-sm">Loading profile...</p>
    </div>
  } @else if (loadError()) {
    <div class="flex flex-col items-center gap-2">
      <p-message severity="error">{{ loadError() }}</p-message>
      <button
        type="button"
        pButton
        size="small"
        severity="secondary"
        [outlined]="true"
        [disabled]="isLoading()"
        (click)="reload()"
      >
        @if (isLoading()) {
          <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
        } @else {
          <i class="pi pi-refresh" aria-hidden="true"></i>
        }
        Try again
      </button>
    </div>
  } @else {
    <form class="p-fluid flex flex-col gap-4" [formRoot]="profileForm">
      <p-panel header="Profile" [toggleable]="true">
        <div class="grid gap-4 sm:grid-cols-2">
          <app-form-field [field]="profileForm.firstName">
            <label for="firstName">First name</label>
            <input
              id="firstName"
              type="text"
              pInputText
              [formField]="profileForm.firstName"
            />
          </app-form-field>

          <app-form-field [field]="profileForm.lastName">
            <label for="lastName">Last name</label>
            <input
              id="lastName"
              type="text"
              pInputText
              [formField]="profileForm.lastName"
            />
          </app-form-field>
        </div>
      </p-panel>

      @if (submitError()) {
        <p-message severity="error">{{ submitError() }}</p-message>
      }

      <div class="flex flex-wrap items-center justify-end gap-2">
        <a pButton severity="secondary" [outlined]="true" [routerLink]="['/account']">
          Cancel
        </a>
        <button type="submit" pButton [disabled]="isSubmitting()">
          @if (isSubmitting()) {
            <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
          } @else {
            <i class="pi pi-save" aria-hidden="true"></i>
          }
          {{ isSubmitting() ? 'Saving...' : 'Save changes' }}
        </button>
      </div>
    </form>
  }
</p-card>
