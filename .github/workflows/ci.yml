name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  requirements:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Validate documentation structure and links
        run: npm run docs:validate

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Template.Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15
          cache: npm
          cache-dependency-path: src/Template.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Template.Backend/Template.Backend.slnx

      - name: Format check
        run: dotnet format src/Template.Backend/Template.Backend.slnx --severity warn --verify-no-changes --exclude "**/Persistence/Migrations/**"

      - name: Test
        run: dotnet test src/Template.Backend/Template.Backend.slnx -c Release --no-restore

      - name: Build
        run: dotnet build src/Template.Backend/Template.Backend.slnx -c Release --no-restore

  deployment:
    name: Deployment automation
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/deploy/ansible/ansible.cfg
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: deploy/ansible/requirements-ci.txt

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15

      - name: Install deployment tooling
        run: python -m pip install --requirement deploy/ansible/requirements-ci.txt

      - name: Validate inventory, generator, and GitLab YAML
        run: |
          ansible-inventory --inventory deploy/ansible/inventory/hosts.yml --list > /tmp/inventory.json
          python deploy/scripts/generate-deployment-pipeline.py \
            --inventory deploy/ansible/inventory/hosts.yml \
            --application-version v0.0.0 \
            --configuration-commit 0000000000000000000000000000000000000000 \
            --output /tmp/deployment-pipeline.yml
          python deploy/scripts/validate-gitlab-ci.py
          python -m unittest discover --start-directory deploy/scripts/tests --verbose

      - name: Validate Ansible playbooks
        run: |
          for playbook in deploy/ansible/playbooks/*.yml; do
            ansible-playbook --inventory deploy/ansible/inventory/hosts.yml --syntax-check "$playbook"
          done
          ansible-lint deploy/ansible/playbooks/*.yml

      - name: Verify deterministic package contract
        run: bash deploy/scripts/test-package.sh
