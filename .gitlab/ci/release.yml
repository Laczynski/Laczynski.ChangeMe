.stable-tag-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

release:backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  extends: .stable-tag-rules
  needs:
    - backend:verify
  cache:
    key:
      files:
        - src/ChangeMe.Backend/Directory.Packages.props
    paths:
      - .nuget/packages/
    policy: pull
  script:
    - >-
      dotnet publish
      src/ChangeMe.Backend/src/ChangeMe.Backend.Web/ChangeMe.Backend.Web.csproj
      -c Release
      -r linux-x64
      --self-contained true
      --output artifacts/backend
      -p:DebugType=None
      -p:DebugSymbols=false
  artifacts:
    expire_in: 1 day
    paths:
      - artifacts/backend/

release:package:
  stage: build
  image: node:24.15.0-bookworm
  extends: .stable-tag-rules
  needs:
    - job: frontend:verify
      artifacts: true
    - job: release:backend
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git
  script:
    - export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$CI_COMMIT_SHA")"
    - export MIGRATION_ID="$(find src/ChangeMe.Backend/src/ChangeMe.Backend.Infrastructure/Persistence/Migrations -type f -name '*.cs' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
    - >-
      bash deploy/scripts/package.sh
      "$CI_PROJECT_PATH_SLUG"
      "$CI_COMMIT_TAG"
      "$CI_COMMIT_SHA"
      "$CI_PIPELINE_URL"
      "$SOURCE_DATE_EPOCH"
      "$MIGRATION_ID"
      artifacts/backend
      artifacts/frontend/browser
      artifacts/package
    - node scripts/extract-changelog.mjs "${CI_COMMIT_TAG#v}" > artifacts/package/release-notes.md
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/package/

release:publish:
  stage: release
  image: alpine:3.23
  extends: .stable-tag-rules
  needs:
    - job: release:package
      artifacts: true
  before_script:
    - apk add --no-cache curl
  script:
    - export PACKAGE_FILE="${CI_PROJECT_PATH_SLUG}-${CI_COMMIT_TAG}-linux-x64.tar.gz"
    - export PACKAGE_BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_PATH_SLUG}/${CI_COMMIT_TAG}"
    - |
      publish_immutable_file() {
        local_path="$1"
        remote_name="$2"
        existing_path="/tmp/existing-${remote_name}"

        if ! status="$(curl --silent --show-error --location \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --output "$existing_path" \
          --write-out '%{http_code}' \
          "${PACKAGE_BASE_URL}/${remote_name}")"; then
          echo "Could not inspect existing package asset ${remote_name}." >&2
          return 1
        fi

        case "$status" in
          200)
            if ! cmp -s "$local_path" "$existing_path"; then
              echo "Immutable package conflict for ${remote_name}; the tag was already published with different bytes." >&2
              return 1
            fi
            echo "Package asset already exists with identical bytes: ${remote_name}"
            ;;
          404)
            curl --fail-with-body --location \
              --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              --upload-file "$local_path" \
              "${PACKAGE_BASE_URL}/${remote_name}"
            ;;
          *)
            echo "Unexpected HTTP status ${status} while inspecting ${remote_name}." >&2
            return 1
            ;;
        esac
      }

      publish_immutable_file "artifacts/package/${PACKAGE_FILE}" "${PACKAGE_FILE}"
      publish_immutable_file "artifacts/package/${PACKAGE_FILE}.manifest.json" "${PACKAGE_FILE}.manifest.json"
      publish_immutable_file "artifacts/package/${PACKAGE_FILE}.sha256" "${PACKAGE_FILE}.sha256"

release:create:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.58.0
  extends: .stable-tag-rules
  needs:
    - job: release:package
      artifacts: true
    - job: release:publish
      artifacts: false
  script:
    - test -s artifacts/package/release-notes.md
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: artifacts/package/release-notes.md
    assets:
      links:
        - name: "$CI_PROJECT_PATH_SLUG-$CI_COMMIT_TAG-linux-x64.tar.gz"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_PATH_SLUG/$CI_COMMIT_TAG/$CI_PROJECT_PATH_SLUG-$CI_COMMIT_TAG-linux-x64.tar.gz"
          link_type: package
        - name: "Package manifest"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_PATH_SLUG/$CI_COMMIT_TAG/$CI_PROJECT_PATH_SLUG-$CI_COMMIT_TAG-linux-x64.tar.gz.manifest.json"
          link_type: other
        - name: "SHA-256 checksum"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_PATH_SLUG/$CI_COMMIT_TAG/$CI_PROJECT_PATH_SLUG-$CI_COMMIT_TAG-linux-x64.tar.gz.sha256"
          link_type: other
