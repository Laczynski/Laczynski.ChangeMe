deploy:generate:
  stage: plan
  image: python:3.13-slim-bookworm
  needs:
    - job: release:publish
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SELECTED_APPLICATION_VERSION =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - python -m pip install --no-cache-dir --requirement deploy/ansible/requirements.txt
  script:
    - export APPLICATION_VERSION="${CI_COMMIT_TAG:-$SELECTED_APPLICATION_VERSION}"
    - >-
      python deploy/scripts/generate-deployment-pipeline.py
      --inventory deploy/ansible/inventory/hosts.yml
      --application-version "$APPLICATION_VERSION"
      --configuration-commit "$CI_COMMIT_SHA"
      --output artifacts/deployment-pipeline.yml
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/deployment-pipeline.yml

deploy:environments:
  stage: deploy
  needs:
    - job: deploy:generate
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SELECTED_APPLICATION_VERSION =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  trigger:
    include:
      - artifact: artifacts/deployment-pipeline.yml
        job: deploy:generate
